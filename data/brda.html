  } else {
    let list = DATA.wines.filter(w => fold(w.name + " " + w.winery_name).includes(q));
    if (typeF === "1" || typeF === "2") list = list.filter(w => String(w.type_id) === typeF);
    else if (typeF === "other") list = list.filter(w => w.type_id !== 1 && w.type_id !== 2);
    if (minRate > 0) list = list.filter(w => (w.avg||0) >= minRate);
    list.sort(sortBy === "name" ? (a,b) => a.name.localeCompare(b.name, "sl") :
              sortBy === "cnt" ? (a,b) => (b.cnt||0)-(a.cnt||0) :
              (a,b) => (b.avg||0)-(a.avg||0) || (b.cnt||0)-(a.cnt||0));
    html = list.map(w => wineRow(w, true)).join("");
  }
  out.innerHTML = html || `<div class="empty">Ni zadetkov.</div>`;
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  tab = b.dataset.tab; render();
});
document.querySelectorAll("#winebar .chip").forEach(b => b.onclick = () => {
  document.querySelectorAll("#winebar .chip").forEach(x => x.classList.toggle("on", x === b));
  typeF = b.dataset.type; render();
});
document.querySelectorAll("#dokbar .chip").forEach(b => b.onclick = () => {
  document.querySelectorAll("#dokbar .chip").forEach(x => x.classList.toggle("on", x === b));
  dokDayF = b.dataset.day; render();
});
document.getElementById("sort").onchange = e => { sortBy = e.target.value; render(); };
document.getElementById("wsort").onchange = e => { wSortBy = e.target.value; render(); };
document.getElementById("minrate").oninput = e => {
  minRate = parseFloat(e.target.value);
  document.getElementById("minrateval").textContent = minRate.toFixed(1);
  render();
};
document.getElementById("dokminrate").oninput = e => {
  dokMinRate = parseFloat(e.target.value);
  document.getElementById("dokminrateval").textContent = dokMinRate.toFixed(1);
  render();
};
document.getElementById("q").oninput = e => { q = fold(e.target.value); render(); };
document.getElementById("meta").textContent =
  `${DATA.wineries.length} vinarjev · ${DATA.wines.length} vin · ${DATA.n_reviews} ocen · ${DATA.generated_at}`;
render();
</script>
</body>

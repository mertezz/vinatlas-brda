[project]
name = "vinatlas"
version = "0.1.0"
description = "Multi-source wine review database (Vivino → Goriška Brda) for analysis and winery visit recommendations."
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.15.0",
    "duckdb>=1.1",
]

[project.scripts]
vinatlas-fetch = "vinatlas.vivino.fetch:main"
vinatlas-build = "vinatlas.build_db:main"
vinatlas-sql = "vinatlas.sql_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinatlas"]